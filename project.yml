name: JASTIP
include:
  - path: project.local.yml
    optional: true

options:
  bundleIdPrefix: com.jastip
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: JASTIP

    # iphone portrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    
    INFOPLIST_KEY_NSCameraUsageDescription: "The app requires camera access to scan board game pieces"
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: "This app uses Bonjour to find other devices on the local network"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES


targets:
  JASTIP:
    type: application
    platform: iOS
    sources:
      - path: JASTIP

    info: 
      path: JASTIP/Info.plist
      properties:
        NSBonjourServices:
          - _jastip-game._tcp
          - _jastip-game._udp