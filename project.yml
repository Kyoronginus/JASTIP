name: JASTIP
include:
  - path: project.local.yml
    optional: true

options:
  bundleIdPrefix: com.jastip
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: JASTIP
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_NSCameraUsageDescription: "Aplikasi membutuhkan kamera untuk memindai piece boardgame"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES

targets:
  JASTIP:
    type: application
    platform: iOS
    sources:
      - path: JASTIP
